name: Vocab Diversity

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = extract+tree+compile | compile = tool_db from cached tree"
        required: false
        default: "full"
        type: choice
        options: [full, compile]
      min-count:
        description: "Minimum corpus frequency for a word to enter the tree"
        required: false
        default: "2"
      in-flight:
        description: "Concurrent categorizer agents"
        required: false
        default: "20"
      words-per-agent:
        description: "Words per categorizer agent"
        required: false
        default: "20"
      chain:
        description: "Auto-continue chain counter (set automatically — do not touch)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: vocab-diversity
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record resume point
        id: resume
        run: |
          BEFORE=$(wc -l < cache/vocab_tree/fragments.jsonl 2>/dev/null || echo 0)
          echo "NOTES_BEFORE=$BEFORE" >> "$GITHUB_ENV"
          HAVE=$([ -f vocab/raw_counts.json ] && echo true || echo false)
          echo "have_counts=$HAVE" >> "$GITHUB_OUTPUT"
          echo "resuming with $BEFORE cached chunks, counts present: $HAVE"

      - name: Install poppler (pdftotext)
        if: inputs.mode == 'full' && steps.resume.outputs.have_counts == 'false'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Extract vocabulary
        if: inputs.mode == 'full' && steps.resume.outputs.have_counts == 'false'
        run: python3 scripts/vocab/extract_vocab.py

      - name: Build word tree (20-word categorizers + consolidation)
        if: inputs.mode == 'full'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORCA_API_KEY: ${{ secrets.ORCA_API_KEY }}
        run: |
          python3 scripts/vocab/build_tree.py \
            --min-count "${{ inputs.min-count }}" \
            --in-flight "${{ inputs.in-flight }}" \
            --words-per-agent "${{ inputs.words-per-agent }}" \
            --max-minutes 205 \
            --commit-every 25

      - name: Compile tool database
        run: python3 scripts/vocab/compile_tool_db.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "vocab-bot"
          git config user.email "vocab-bot@users.noreply.github.com"
          git add -A vocab cache 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Vocab diversity update (run ${{ github.run_id }}, mode ${{ inputs.mode }})"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Chain next run (auto-continue until the tree is compiled)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHAIN="${{ inputs.chain }}"
          if [ -f vocab/tree.json ]; then
            echo "tree.json committed — vocab complete, chain ends"
            exit 0
          fi
          if [ "$CHAIN" -ge 40 ]; then
            echo "chain limit reached — stopping"
            exit 0
          fi
          BEFORE="${NOTES_BEFORE:-0}"
          AFTER=$(find cache/vocab_tree -name '*.md' 2>/dev/null | wc -l || echo 0)
          FRAGS=$(wc -l < cache/vocab_tree/fragments.jsonl 2>/dev/null || echo 0)
          echo "chain=$CHAIN fragments=$FRAGS"
          if [ "${{ inputs.mode }}" = "compile" ]; then
            echo "compile run — chain ends here"
            exit 0
          fi
          PROGRESS=$(( FRAGS > BEFORE ? 1 : 0 ))
          if [ "$PROGRESS" -eq 0 ] && [ "$CHAIN" != "0" ]; then
            echo "no fragment progress this run — stopping the chain (needs attention)"
            exit 0
          fi
          echo "chaining next vocab run (chain $((CHAIN + 1)))"
          gh workflow run vocab-diversity.yml \
            -R "${{ github.repository }}" -f mode=full -f chain=$((CHAIN + 1)) \
            -f min-count="${{ inputs.min-count }}" \
            -f in-flight="${{ inputs.in-flight }}" \
            -f words-per-agent="${{ inputs.words-per-agent }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocab-results-${{ github.run_id }}
          path: |
            vocab/
          if-no-files-found: warn
          retention-days: 14
